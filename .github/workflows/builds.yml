name: Builds

on:
  workflow_dispatch:

jobs:
  builds-linux:
    strategy:
      matrix:
        include:
          - target: linux-i386-dedicated
            build_cmd: |
              chmod +x scripts/build-ubuntu-i386.sh
              scripts/build-ubuntu-i386.sh -d
          - target: linux-amd64-dedicated
            build_cmd: |
              chmod +x scripts/build-ubuntu-amd64.sh
              scripts/build-ubuntu-amd64.sh -d
          
    name: Build ${{matrix.target}}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source (shallow clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
        
      - name: Build ${{matrix.target}}
        run: |
          ${{matrix.build_cmd}}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: csso-${{matrix.target}}
          path: ./output/*

  builds-windows:
    strategy:
      matrix:
        include:
          - target: windows-i386-dedicated
            build_cmd: |
              ./waf.bat configure -T release --build-games=csso -4 -d --disable-warns --prefix="./output"
              ./waf.bat install
          - target: windows-i386
            build_cmd: |
              ./waf.bat configure -T release --build-games=csso -4 --enable-opus --disable-warns --prefix="./output"
              ./waf.bat install
    name: Build ${{matrix.target}}
    runs-on: windows-latest

    steps:
      - name: Checkout source (shallow clone)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
        
      - name: Build ${{matrix.target}}
        run: |
          ${{matrix.build_cmd}}
          Get-ChildItem -Path "./output" -Include *.pdb,*.lib -Recurse | Remove-Item -Force
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: csso-${{matrix.target}}
          path: ./output/*

  builds-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout csso-android source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Build native .so libraries
        run: |
          chmod +x scripts/build-android-aarch64.sh
          scripts/build-android-aarch64.sh

      - name: List built libraries
        run: |
          echo "=== Built .so files ==="
          find ./output -name "*.so" -type f | sort
          echo ""
          echo "=== Library sizes ==="
          du -sh ./output/lib/arm64-v8a/*.so 2>/dev/null | head -20

      - name: Checkout launcher repo
        uses: actions/checkout@v4
        with:
          repository: ndke01/csso-android-launcher
          path: csso-android-launcher
          fetch-depth: 1

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-29" "build-tools;33.0.1" "platform-tools"

      - name: Copy native libraries into launcher
        run: |
          DEST_ARM64=csso-android-launcher/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST_ARM64"

          cp ./output/lib/arm64-v8a/*.so "$DEST_ARM64/"

          echo "=== Libraries in launcher ==="
          ls -lh "$DEST_ARM64/"

      - name: Build VPK assets
        working-directory: csso-android-launcher/scripts
        run: |
          pip install vpk 2>/dev/null || pip3 install vpk 2>/dev/null || true
          vpk -c vpk/ ../app/src/main/assets/extras_dir.vpk
          VPKSHA=$(sha1sum ../app/src/main/assets/extras_dir.vpk | cut -d ' ' -f 1)
          echo "VPK sha1sum = $VPKSHA"
          sed -i "s|GET_VPK_CHECKSUM_AND_REPLACE_ME|$VPKSHA|" ../app/src/main/res/values/vpk.xml

      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore csso-android-launcher/csso-release.keystore \
            -alias csso \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass csso1234 \
            -keypass csso1234 \
            -dname "CN=CSSO, OU=Dev, O=CSSO, L=Unknown, ST=Unknown, C=US"

      - name: Configure signing
        working-directory: csso-android-launcher
        run: |
          cat > keystore.properties <<EOF
          storePassword=csso1234
          keyPassword=csso1234
          keyAlias=csso
          storeFile=csso-release.keystore
          EOF

          cat > app/build.gradle <<'BUILDEOF'
          import java.time.LocalDateTime
          import java.time.Month
          import java.time.temporal.ChronoUnit

          plugins {
              id 'com.android.application'
          }

          android {
              lintOptions {
                  disable 'ExpiredTargetSdkVersion'
              }

              namespace 'me.dmk95.csso'
              compileSdk 29

              signingConfigs {
                  release {
                      storeFile file("../csso-release.keystore")
                      storePassword "csso1234"
                      keyAlias "csso"
                      keyPassword "csso1234"
                  }
              }

              packagingOptions {
                  jniLibs {
                      useLegacyPackaging true
                  }
              }

              project.ext.set("archivesBaseName", "csso")

              defaultConfig {
                  applicationId "me.dmk95"
                  applicationIdSuffix "csso"
                  minSdk 24
                  targetSdk 29
                  versionCode getBuildNum()
                  versionName "2.0"
              }

              sourceSets {
                  debug {
                      java.srcDirs = [ 'src/main/java', 'src/build-debug/java' ]
                  }
                  release {
                      java.srcDirs = [ 'src/main/java', 'src/build-release/java' ]
                  }
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                      shrinkResources false
                      debuggable true
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
                  }
                  release {
                      minifyEnabled false
                      shrinkResources false
                      signingConfig signingConfigs.release
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.3.1'
          }

          static def getBuildNum() {
              LocalDateTime now = LocalDateTime.now()
              LocalDateTime releaseDate = LocalDateTime.of(2023, Month.FEBRUARY, 18, 0, 0, 0)
              int qBuildNum = releaseDate.until(now, ChronoUnit.DAYS)
              return qBuildNum-1
          }
          BUILDEOF

      - name: Build APK (debug)
        working-directory: csso-android-launcher
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build APK (release - signed)
        working-directory: csso-android-launcher
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Find APK files
        id: find-apk
        run: |
          echo "=== APK files ==="
          find csso-android-launcher -name "*.apk" -type f
          APK_PATH=$(find csso-android-launcher -name "*.apk" -type f | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: csso-android-native
          path: ./output/lib/arm64-v8a/

      - name: Upload APK (debug)
        uses: actions/upload-artifact@v4
        with:
          name: csso-debug-apk
          path: csso-android-launcher/app/build/outputs/apk/debug/*.apk

      - name: Upload APK (release - signed)
        uses: actions/upload-artifact@v4
        with:
          name: csso-release-apk-signed
          path: csso-android-launcher/app/build/outputs/apk/release/*.apk